rules:
- id: R01
  name: Readiness and configuration
  statement: P1B requires cfg_integrity_ok=true on nominal runs
  channels:
  - cfg_integrity_ok
  - seq_subphase_id
  applicability: nominal_only
  implementation_status: definition_only
  severity: major
- id: R02
  name: Timestamp integrity
  statement: source_time increases by 0.5 seconds per scheduled row; clock corrections are separately logged
  channels:
  - clk_offset_ms
  - clk_lock_state
  - clk_resync_count
  applicability: all_runs
  implementation_status: definition_only
  severity: critical
- id: R03
  name: State sequence
  statement: Nominal run visits P0A through P6B in declared order; anomalous reported states may differ from
    canonical truth
  channels:
  - seq_phase_id
  - seq_subphase_id
  applicability: nominal_only
  implementation_status: definition_only
  severity: critical
- id: R04
  name: Stage event triangulation
  statement: P3 reported transition must be supported by independent STG and LOG observations
  channels:
  - seq_pending
  - stg_state
  - stg_event
  - log_seq
  applicability: evidence_rule
  implementation_status: definition_only
  severity: major
- id: R05
  name: Source versus delivery loss
  statement: Increment daq_missing_samples only on source capture loss; delivery-only loss changes COM observations
  channels:
  - daq_missing_samples
  - com_loss_pct
  - com_gap_s
  applicability: all_runs
  implementation_status: definition_only
  severity: major
- id: R06
  name: Health aggregation
  statement: Reported aggregate state must be explainable from active warnings and observation-quality indicators
  channels:
  - hlt_overall_state
  - hlt_warning_count
  - hlt_degraded
  - pwr_fault
  - thm_warning
  - act_fault
  applicability: evidence_rule
  implementation_status: definition_only
  severity: major
- id: R07
  name: Safe-state consistency
  statement: Reported safe state requires compatible supervisor and interlock observations
  channels:
  - saf_state
  - saf_interlock_ok
  - sup_state
  applicability: evidence_rule
  implementation_status: definition_only
  severity: major
- id: R08
  name: Log continuity
  statement: Event log sequence and source/delivery timestamps permit reconciliation; late arrival does not
    rewrite event time
  channels:
  - log_seq
  - log_integrity_ok
  - log_backlog
  applicability: all_runs
  implementation_status: definition_only
  severity: major
- id: R09
  name: Derived thermal delta
  statement: thm_delta_pu equals core minus payload within synthetic rounding tolerance
  channels:
  - thm_delta_pu
  - thm_core_temp_pu
  - thm_payload_temp_pu
  applicability: all_runs
  implementation_status: definition_only
  severity: major
- id: R10
  name: Counter monotonicity
  statement: Designated cumulative counters never decrease within an epoch
  channels:
  - clk_resync_count
  - daq_missing_samples
  - sup_fault_count
  - saf_event_count
  - log_seq
  applicability: all_runs
  implementation_status: definition_only
  severity: critical
- id: R11
  name: Visual provenance
  statement: Run-derived figure metadata must carry exact run id, time range and channel ids
  channels: []
  applicability: all_runs
  implementation_status: definition_only
  severity: major
- id: R12
  name: Ground truth separation
  statement: Private anomaly truth files are not part of agent-accessible retrieval or figure context
  channels: []
  applicability: all_runs
  implementation_status: definition_only
  severity: critical
