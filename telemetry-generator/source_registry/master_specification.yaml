tools:
- name: find_figure
  input_required:
  - query
  output_required:
  - matching_figure_ids
  - ranked_evidence_refs
  must_do: retrieve registry IDs and captions; no invented figure identifiers
- name: ask_figure
  input_required:
  - figure_id
  - question
  output_required:
  - answer
  - observations
  - figure_id
  - uncertainty
  - requires_verification
  must_do: visually ground claims and say when a label is unreadable; do not expose private truth
- name: get_figure_context
  input_required:
  - figure_id
  output_required:
  - document_refs
  - linked_channel_ids
  - figure_provenance
  must_do: resolve IDs from canonical registry; do not infer undocumented linkages
- name: verify_figure_against_data
  input_required:
  - figure_id
  - run_id
  - claimed_observation
  output_required:
  - verified
  - supporting_data_refs
  - discrepancies
  - limitations
  must_do: check run ID and input-data hash; quant claims must match source data
