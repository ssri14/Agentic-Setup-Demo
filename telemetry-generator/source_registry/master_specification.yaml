- id: QG-01
  name: Canonical schema and reference integrity
  state: pending_review
- id: QG-02
  name: Nominal telemetry semantic consistency
  state: not_started
- id: QG-03
  name: Technical document cross-reference and visual review
  state: not_started
- id: QG-04
  name: Figure-by-figure technical, visual and provenance audit
  state: not_started
- id: QG-05
  name: Anomalous runs and hidden-truth isolation
  state: not_started
- id: QG-06
  name: Cross-modal benchmark evaluation
  state: not_started
